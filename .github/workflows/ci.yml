name: CI

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests   # npm test already compiles the TypeScript
        run: npm test

      - name: Copy dashboard assets   # completes the vscode:prepublish output without recompiling
        run: npm run copy-dashboard

  webview-tests:
    name: Dashboard UI Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run dashboard UI tests
        run: npm run test:ui
